name: docs

# Build the documentation site with MkDocs and publish it to GitHub Pages.
# One-time setting: Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "scripts/**", ".github/workflows/docs.yml"]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt

      # The "Latest CI run" page comes from the newest green ci.yml run on main. If there is none
      # yet, it falls back to the committed ci results, so the build never shows a blank page.
      - name: Fetch latest CI metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name results-ci --dir _ci; then
            make docs-latest FROM=_ci/docs/results/ci RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
          else
            make docs-latest FROM=docs/results/ci
          fi

      - run: mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
