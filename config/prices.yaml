# Cloud prices for scripts/estimate_cost.py. USD per hour unless stated. Prices change: every
# block records where it came from, when, and how much to trust it. Refresh before quoting a
# number to anyone, and never treat spot prices as fixed (they move hourly).
#
# confidence: high   = read from the provider's own price list
#             medium = derived from provider data (e.g. spot = on-demand x published typical saving)
#             low    = third-party aggregator; use for rough comparison only
#
# Sizes marked derived: true are half of the listed 8-vCPU size in the same family. AWS and GCP
# price these families linearly by size, but check before relying on it.

retrieved: 2026-10-22

aws_ec2:
  source_on_demand: "AWS Price List bulk API: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonEC2/current/<region>/index.json (published 2026-10-22)"
  source_spot: "AWS Spot Instance Advisor typical savings (https://spot-bid-advisor.s3.amazonaws.com/spot-advisor-data.json) applied to on-demand"
  confidence_on_demand: high
  confidence_spot: medium
  regions:
    ca-central-1:
