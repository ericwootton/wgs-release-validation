      - {name: r6i.2xlarge, vcpu: 8, mem_gib: 64, on_demand: 0.552,  spot: 0.2760}
    us-east-1:
      - {name: c6i.xlarge,  vcpu: 4, mem_gib: 8,  on_demand: 0.170,  spot: 0.0748, derived: true}
