aws_healthomics:
  source: "AWS Price List bulk API: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonOmics/current/us-east-1/index.json (published 2026-09-11)"
  confidence: high
  regions:
    us-east-1:
      - {name: omics.c.xlarge,  vcpu: 4, mem_gib: 8,  on_demand: 0.2295}
      - {name: omics.m.xlarge,  vcpu: 4, mem_gib: 16, on_demand: 0.2592}
      - {name: omics.c.2xlarge, vcpu: 8, mem_gib: 16, on_demand: 0.459}
      - {name: omics.m.2xlarge, vcpu: 8, mem_gib: 32, on_demand: 0.5184}
      - {name: omics.r.2xlarge, vcpu: 8, mem_gib: 64, on_demand: 0.6804}
  # Run storage is billed for the whole run. The 1,200 GiB static default is an assumption to
  # check against the HealthOmics docs; dynamic run storage is billed on use instead.
  run_storage_gb_hour: 0.0001918
  run_storage_gib_assumed: 1200

