# miniwdl settings for local and CI runs (miniwdl run ... --cfg config/miniwdl.cfg).

[task_runtime]
# Enforce runtime.memory as a hard limit, as a cloud VM of that size would. Without this a task
# that needs more memory than it requests still succeeds locally and fails only in the cloud.
memory_limit_multiplier = 1.0

[call_cache]
# Off: release validation must re-run every task. Turn on locally while editing docs or reports.
put = false
get = false
