[project]
name = "wgs-release-validation"
version = "0.1.0"
description = "Release validation for a WDL germline variant-calling workflow, benchmarked against GIAB HG002"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Eric Wootton" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en dashes and symbols in report text are intentional

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["scripts"]
