# Cromwell 92 with the Google Cloud Batch backend, for docs/results/cloud-run.md.
# Copy to cromwell-gcp.conf (git-ignored) and replace the <...> values there. Never commit the
# copy: it names your project and bucket.
# Based on cromwell.example.backends/GCPBATCH.conf in the Cromwell repository.

include required(classpath("application"))

google {
  application-name = "wgs-release-validation"
  auths = [{ name = "application-default", scheme = "application_default" }]
}

engine {
  filesystems {
    gcs { auth = "application-default" }
  }
}

call-caching { enabled = false }   # every validation run recomputes from scratch

backend {
  default = GCPBATCH
  providers {
    GCPBATCH {
      actor-factory = "cromwell.backend.google.batch.GcpBatchBackendLifecycleActorFactory"
      config {
        project = "<project-id>"
        root = "gs://<bucket>/cromwell"
        maximum-polling-interval = 600
        batch-timeout = 1 day

        batch {
          auth = "application-default"
          compute-service-account = "<vm-service-account>@<project-id>.iam.gserviceaccount.com"
          location = "northamerica-northeast1"   # the region priced in config/prices.yaml
        }

        filesystems {
          gcs {
            auth = "application-default"
            project = "<project-id>"
          }
        }

        default-runtime-attributes {
          cpu: 1
          memory: "2048 MB"
          bootDiskSizeGb: 20
          disks: "local-disk 20 HDD"
          noAddress: false        # tasks stream the reference and reads over HTTPS
          # Above 0, Cromwell asks Batch for Spot VMs (BatchUtilityConversions.toProvisioningModel).
          preemptible: 2
          zones: ["northamerica-northeast1-a", "northamerica-northeast1-b", "northamerica-northeast1-c"]
        }
      }
    }
  }
}
